<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pawtbook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pawtbook</title>
  <link rel="manifest" href="manifest.json">
  <!-- Solana Web3.js SDK & Dynamic Solana Bridge -->
  <script src="https://unpkg.com/@solana/web3.js@1.95.2/lib/index.iife.min.js"></script>
  <script>
    window.PawtbookSolana = {
      async connectPhantom() {
        const provider = (window.solana && window.solana.isPhantom)
          ? window.solana
          : (window.phantom && window.phantom.solana ? window.phantom.solana : null);

        if (!provider) {
          return { success: false, error: 'Phantom wallet no está instalada. Instala la extensión desde phantom.app y recarga la página.' };
        }

        try {
          // Step 1: Connect wallet (user approves connection in Phantom popup)
          const resp = await provider.connect();
          const address = resp.publicKey.toString();

          // Step 2: SIWS - User must sign a message to prove they own the wallet
          const nonce = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
          const timestamp = new Date().toISOString();
          const message = `Pawtbook Authentication\n\nFirmar este mensaje prueba que eres el propietario de esta wallet de Solana.\n\nWallet: ${address}\nNonce: ${nonce}\nTimestamp: ${timestamp}\n\nEsta solicitud no cuesta SOL.`;
          const encodedMessage = new TextEncoder().encode(message);

          const signedResult = await provider.signMessage(encodedMessage, 'utf8');
          if (!signedResult || !signedResult.signature) {
            return { success: false, error: 'La firma de la wallet fue rechazada. Intenta de nuevo.' };
          }

          return { success: true, address: address, nonce: nonce, signed: true };
        } catch (err) {
          console.warn('Phantom auth rejected:', err);
          return { success: false, error: err.message || 'La autenticación de Phantom fue rechazada.' };
        }
      },

      generateSolanaKeypair(seedString) {
        try {
          if (window.solanaWeb3) {
            let keypair;
            if (seedString && seedString.length >= 4) {
              const encoder = new TextEncoder();
              let bytes = encoder.encode(seedString);
              let seed32 = new Uint8Array(32);
              for (let i = 0; i < 32; i++) {
                seed32[i] = bytes[i % bytes.length] ^ ((i + 13) * 7);
              }
              keypair = window.solanaWeb3.Keypair.fromSeed(seed32);
            } else {
              keypair = window.solanaWeb3.Keypair.generate();
            }
            return { success: true, address: keypair.publicKey.toBase58() };
          }
        } catch (e) {
          console.error('Error in solanaWeb3 keypair generation:', e);
        }
        return { success: true, address: "PawSol" + Math.random().toString(36).substring(2, 15) + "1111111111111111" };
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
