<!DOCTYPE html>
<html>
<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pawtbook">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pawtbook</title>
  <link rel="manifest" href="manifest.json">
  <!-- Solana Web3.js SDK & Dynamic Solana Bridge -->
  <script src="https://unpkg.com/@solana/web3.js@1.95.2/lib/index.iife.min.js"></script>
  <script>
    window.PawtbookSolana = {
      async connectPhantom() {
        if (window.solana && window.solana.isPhantom) {
          try {
            const resp = await window.solana.connect();
            return { success: true, address: resp.publicKey.toString() };
          } catch (err) {
            console.warn('Phantom connect rejected:', err);
          }
        }
        if (window.phantom && window.phantom.solana) {
          try {
            const resp = await window.phantom.solana.connect();
            return { success: true, address: resp.publicKey.toString() };
          } catch (err) {
            console.warn('Phantom solana connect rejected:', err);
          }
        }
        return this.generateSolanaKeypair();
      },

      generateSolanaKeypair(seedString) {
        try {
          if (window.solanaWeb3) {
            let keypair;
            if (seedString && seedString.length >= 4) {
              const encoder = new TextEncoder();
              let bytes = encoder.encode(seedString);
              let seed32 = new Uint8Array(32);
              for (let i = 0; i < 32; i++) {
                seed32[i] = bytes[i % bytes.length] ^ ((i + 13) * 7);
              }
              keypair = window.solanaWeb3.Keypair.fromSeed(seed32);
            } else {
              keypair = window.solanaWeb3.Keypair.generate();
            }
            return { success: true, address: keypair.publicKey.toBase58() };
          }
        } catch (e) {
          console.error('Error in solanaWeb3 keypair generation:', e);
        }
        return { success: true, address: "PawSol" + Math.random().toString(36).substring(2, 15) + "1111111111111111" };
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
